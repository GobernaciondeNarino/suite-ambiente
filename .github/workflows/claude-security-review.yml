# Revisión de seguridad automática (anthropics/claude-code-security-review).
# Analiza el diff de cada pull request y comenta hallazgos de seguridad.
# Requiere el secreto ANTHROPIC_API_KEY en Settings → Secrets and variables → Actions.
# La acción no está endurecida contra prompt injection: activa en el repositorio
# "Require approval for all external contributors" para PR de forks.
name: Revisión de seguridad (Claude)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Auditoría de seguridad del diff
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: .claude/skills,docs
          custom-security-scan-instructions: .github/security/instrucciones-wordpress.txt
